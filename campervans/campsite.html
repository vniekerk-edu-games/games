<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campsite | The Camper Vans SA</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a class="brand" href="index.html"><img src="assets/logo.png" alt=""><span>The Camper Vans SA</span></a>
  <div class="navlinks"><a href="index.html">Home</a><a href="map.html">Map</a><a href="index.html#top">About</a></div>
</nav>

<div class="crumb" id="crumb"></div>
<header class="dtitle"><h1 id="title"></h1><div class="meta" id="meta"></div></header>

<div class="mosaic" id="mosaic"><div class="nogallery">Loading photos…</div></div>

<main class="dmain">
  <div class="dtext">
    <div class="chips" id="feats"></div>
    <div id="text"></div>
  </div>
  <aside class="side">
    <div class="panel"><h2>Find it</h2><div id="mini" role="region" aria-label="Location map"></div><div id="directions"></div></div>
    <div class="panel" id="sitepanel"><h2>Book or ask</h2><div id="website"></div></div>
  </aside>
</main>

<section class="more" id="more" hidden>
  <div class="inner"><h2 id="more-h"></h2><div class="g4" id="more-grid"></div></div>
</section>

<div class="pager" id="pager" role="navigation" aria-label="More campsites"></div>

<footer>
  <div>Website done by JEM Design</div>
  <div>Contact us: <a href="mailto:jem.design.za@gmail.com">jem.design.za@gmail.com</a></div>
</footer>

<dialog id="lb" aria-label="Photo viewer">
  <button class="lbx" id="lbclose" type="button" aria-label="Close">×</button>
  <button class="lbn prev" id="lbprev" type="button" aria-label="Previous photo">‹</button>
  <img id="lbimg" alt="">
  <button class="lbn next" id="lbnext" type="button" aria-label="Next photo">›</button>
  <div class="lbc" id="lbcount"></div>
</dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
<script>detail()</script>
</body>
</html>
