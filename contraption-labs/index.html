<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contraption Labs</title>
  <!-- When you update the game, change ?v=… on every file below so browsers fetch the new files. -->
  <meta name="description" content="Contraption Labs: a physics playground for curious kids.">
  <meta name="theme-color" content="#0B2D6B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6b">
</head>
<body class="mode-build">
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">⚙️</span>
        <span class="title">Contraption <b>Labs</b></span>
        <span class="tag" id="modeTag">Sandbox</span>
      </div>
      <nav class="controls" aria-label="Lab controls">
        <div class="group">
          <button id="btnPuzzles" class="btn accent" title="Choose a puzzle">🧩 <span>Puzzles</span></button>
          <button id="btnHint" class="btn" title="Get a hint" hidden>💡 <span>Hint</span></button>
          <button id="btnRestart" class="btn" title="Take out all your parts and start the puzzle again" hidden>🧹 <span>Start over</span></button>
        </div>
        <div class="group">
          <button id="btnStart" class="btn big go">▶ <span>Start</span></button>
          <button id="btnPause" class="btn" title="Pause / play (Space)" disabled>⏸ <span>Pause</span></button>
        </div>
        <div class="group">
          <button id="btnUndo" class="btn" title="Undo (Ctrl+Z)" disabled>↶ <span>Undo</span></button>
          <button id="btnRedo" class="btn" title="Redo (Ctrl+Y)" disabled>↷ <span>Redo</span></button>
          <button id="btnSnap" class="btn toggle" aria-pressed="true" title="Snap parts to the grid (G)">🧲 <span>Snap</span></button>
        </div>
        <div class="group">
          <button id="btnSlow" class="btn toggle" aria-pressed="false" title="Slow motion (S)">🐢 <span>Slow-mo</span></button>
          <button id="btnTrails" class="btn toggle" aria-pressed="false" title="Show paths and bounce heights (T)">〰️ <span>Trails</span></button>
          <button id="btnClearBalls" class="btn" title="Remove all balls">🧺 <span>Clear balls</span></button>
        </div>
        <div class="group">
          <button id="btnSave" class="btn" title="Save your build as a file (Ctrl+S)">💾 <span>Save</span></button>
          <button id="btnOpen" class="btn" title="Open a saved build">📂 <span>Open</span></button>
          <button id="btnFull" class="btn accent" title="Full screen (F)">⛶ <span>Full screen</span></button>
          <button id="btnInfo" class="btn info-toggle" title="Show or hide the info panel" aria-pressed="false">ℹ️ <span>Info</span></button>
        </div>
        <input type="file" id="fileOpen" accept=".json,application/json" hidden>
      </nav>
    </header>

    <main class="layout">
      <aside class="side">
        <div class="hand-bar">
          <button id="btnHand" class="hand-btn on" title="Put down what you are holding (right-click or Esc)">✋ <span>Move</span></button>
          <div class="holding" id="holding" hidden>
            <canvas id="holdingIcon" data-type=""></canvas>
            <span><small>Holding</small><b id="holdingName"></b></span>
          </div>
        </div>
        <div class="shelf" id="shelf" aria-label="Parts shelf"></div>
      </aside>

      <section class="stage" id="stage">
        <canvas id="lab" aria-label="Physics lab"></canvas>
        <div class="coach" id="coach" hidden></div>
        <div class="hint-box" id="hintBox" hidden></div>
        <div class="toast" id="toast" role="status"></div>
      </section>

      <aside class="info" id="info" aria-live="polite"></aside>
    </main>
    <div class="overlay" id="overlay" hidden>
      <div class="card" id="overlayCard" role="dialog" aria-modal="true"></div>
    </div>
  </div>

  <script src="js/theme.js?v=6b"></script>
  <!-- engine (no drawing, testable in Node) -->
  <script src="js/engine/catalog.js?v=6b"></script>
  <script src="js/engine/bodies.js?v=6b"></script>
  <script src="js/engine/collide.js?v=6b"></script>
  <script src="js/engine/world.js?v=6b"></script>
  <script src="js/engine/ropes.js?v=6b"></script>
  <script src="js/engine/machines.js?v=6b"></script>
  <script src="js/engine/creatures.js?v=6b"></script>
  <script src="js/engine/layout.js?v=6b"></script>
  <script src="js/engine/goals.js?v=6b"></script>
  <!-- puzzles (plain data: add new ones here) -->
  <script src="js/levels/levels.js?v=6b"></script>
  <!-- drawing -->
  <script src="js/render/art.js?v=6b"></script>
  <script src="js/render/art-machines.js?v=6b"></script>
  <script src="js/render/art-critters.js?v=6b"></script>
  <script src="js/render/art-ropes.js?v=6b"></script>
  <script src="js/render/renderer.js?v=6b"></script>
  <!-- sandbox -->
  <script src="js/sandbox/presets.js?v=6b"></script>
  <script src="js/sandbox/sandbox.js?v=6b"></script>
  <script src="js/sandbox/ui.js?v=6b"></script>
  <script src="js/main.js?v=6b"></script>
</body>
</html>
